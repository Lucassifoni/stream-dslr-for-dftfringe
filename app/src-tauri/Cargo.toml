[package]
name = "livestream"
version = "0.1.1"
edition = "2021"
description = "Camera liveview / stills MJPEG streamer for DFTFringe"
publish = false

[lib]
name = "livestream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
livestream-core = { path = "../core" }
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
